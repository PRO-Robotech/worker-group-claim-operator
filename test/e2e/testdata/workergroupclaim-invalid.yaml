# Invalid: missing clusterName (required field)
apiVersion: workergroup.in-cloud.io/v1alpha1
kind: WorkerGroupClaim
metadata:
  name: invalid-no-cluster
  namespace: e2e-test
spec:
  replicas: 2
  version: "v1.30.1"
  machineTemplateRef:
    name: e2e-machine-tmpl
  bootstrapTemplateRef:
    name: e2e-bootstrap-tmpl
---
# Invalid: negative replicas
apiVersion: workergroup.in-cloud.io/v1alpha1
kind: WorkerGroupClaim
metadata:
  name: invalid-neg-replicas
  namespace: e2e-test
spec:
  clusterName: e2e-cluster
  replicas: -1
  version: "v1.30.1"
  machineTemplateRef:
    name: e2e-machine-tmpl
  bootstrapTemplateRef:
    name: e2e-bootstrap-tmpl
---
# Invalid: empty machineTemplateRef.name (MinLength=1)
apiVersion: workergroup.in-cloud.io/v1alpha1
kind: WorkerGroupClaim
metadata:
  name: invalid-empty-ref
  namespace: e2e-test
spec:
  clusterName: e2e-cluster
  replicas: 2
  version: "v1.30.1"
  machineTemplateRef:
    name: ""
  bootstrapTemplateRef:
    name: e2e-bootstrap-tmpl
---
# Invalid: bad taint effect (Enum validation)
apiVersion: workergroup.in-cloud.io/v1alpha1
kind: WorkerGroupClaim
metadata:
  name: invalid-taint
  namespace: e2e-test
spec:
  clusterName: e2e-cluster
  replicas: 2
  version: "v1.30.1"
  machineTemplateRef:
    name: e2e-machine-tmpl
  bootstrapTemplateRef:
    name: e2e-bootstrap-tmpl
  taints:
    - key: dedicated
      value: gpu
      effect: Invalid
      propagation: Always

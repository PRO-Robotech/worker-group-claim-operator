apiVersion: workergroup.in-cloud.io/v1alpha1
kind: WGMachineTemplate
metadata:
  name: e2e-machine-tmpl
spec:
  value: |
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: BegetMachineTemplate
    spec:
      template:
        spec:
          configuration:
            cpuCount: {{ .cpuCount }}
            memory: {{ .memory }}
            diskSize: 61440
          image: "ubuntu-22.04"
          sshKeyIds:
            - 123
          usePrivateNetwork: true

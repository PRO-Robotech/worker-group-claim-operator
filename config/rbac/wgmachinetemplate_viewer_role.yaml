# This rule is not used by the project worker-group-claim-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to workergroup.in-cloud.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: worker-group-claim-operator
    app.kubernetes.io/managed-by: kustomize
  name: wgmachinetemplate-viewer-role
rules:
- apiGroups:
  - workergroup.in-cloud.io
  resources:
  - wgmachinetemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - workergroup.in-cloud.io
  resources:
  - wgmachinetemplates/status
  verbs:
  - get
